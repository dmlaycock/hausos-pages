<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HausOS - lead allocation</title>
<!--
  HausOS lead allocation - decision page v1.0.0 (1 Oct 2026)
  Static page served from GitHub Pages. Reads ?t=TOKEN&a=confirm|reject, fetches the
  proposal from the lead-allocate Edge Function (JSON) and posts the decision back.
  Nothing is written to Rex until the person presses a button on this page.
-->
<style>
  :root { --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --ok:#1a7f37; --no:#b42318; --bg:#fff; --card:#f9fafb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin:0 0 16px; }
  table { border-collapse:collapse; font-size:15px; width:100%; }
  td { padding:4px 10px 4px 0; vertical-align:top; }
  td:first-child { color:var(--muted); width:34%; white-space:nowrap; }
  .note { font-size:14px; color:#4b5563; border-left:3px solid var(--line); padding-left:10px; margin:12px 0 0; }
  .btn { display:inline-block; padding:11px 18px; border-radius:7px; color:#fff; text-decoration:none; font-weight:600; border:0; font-size:15px; cursor:pointer; }
  .btn.ok { background:var(--ok); } .btn.no { background:var(--no); } .btn.ghost { background:#fff; color:var(--ink); border:1px solid #cbd5e1; }
  .btn[disabled] { opacity:.55; cursor:default; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0 8px; }
  label { display:block; font-weight:600; font-size:14px; margin:12px 0 4px; }
  select, textarea { width:100%; font:inherit; padding:9px; border:1px solid #cbd5e1; border-radius:7px; background:#fff; }
  .muted { color:var(--muted); font-size:13px; }
  .outcome { padding:16px; border-radius:10px; border:1px solid var(--line); }
  .outcome.good { border-color:#bbf7d0; background:#f0fdf4; } .outcome.bad { border-color:#fecaca; background:#fef2f2; }
  .outcome h2 { margin:0 0 6px; font-size:18px; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1 id="title">HausOS lead allocation</h1>
  <p class="sub" id="subtitle">Loading the proposal...</p>
  <div id="view"></div>
  <p class="muted" id="foot"></p>
</main>
<script>
(function () {
  var API = "https://mlhvcyrjycdnswdfsofc.supabase.co/functions/v1/lead-allocate";
  var q = new URLSearchParams(location.search);
  var token = q.get("t") || "";
  var mode = q.get("a") === "reject" ? "reject" : "confirm";
  var view = document.getElementById("view"), subtitle = document.getElementById("subtitle"), title = document.getElementById("title"), foot = document.getElementById("foot");

  function h(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function when(iso) { if (!iso) return "-"; try { return new Date(iso).toLocaleString("en-GB", { timeZone: "Europe/London", dateStyle: "medium", timeStyle: "short" }); } catch (e) { return iso; } }
  function fail(msg) { title.textContent = "HausOS lead allocation"; subtitle.textContent = ""; view.innerHTML = '<div class="outcome bad"><h2>' + h(msg) + '</h2><p class="muted">If this keeps happening, allocate the lead in Rex as usual and let David know.</p></div>'; }

  if (!token) { fail("This link is missing its token."); return; }

  function proposalLine(p) {
    if (p.kind === "contact_only") return "Lead is already with <b>" + h(p.assignee) + "</b>. Proposal: move the contact <b>" + h(p.contact_name) + "</b> (currently owned by " + h(p.contact_owner_name_before || "nobody") + ") to <b>" + h(p.assignee) + "</b> so they can see it.";
    return "Proposal: allocate to <b>" + h(p.proposed_partner_name) + "</b>" + (p.proposed_contact_action === "transfer" ? " and move the contact (currently owned by " + h(p.contact_owner_name_before || "nobody") + ") to them" : "") + ".";
  }
  function summaryCard(p) {
    return '<div class="card"><p style="margin:0 0 10px">' + proposalLine(p) + '</p><table>' +
      '<tr><td>Contact</td><td>' + h(p.contact_name || "(no contact)") + '</td></tr>' +
      '<tr><td>Development</td><td>' + h(p.development || "-") + '</td></tr>' +
      '<tr><td>Source</td><td>' + h(p.source || "-") + (p.lead_type ? " (" + h(p.lead_type) + ")" : "") + '</td></tr>' +
      '<tr><td>Created</td><td>' + h(when(p.created_at)) + ' by ' + h(p.created_by || "-") + '</td></tr>' +
      '<tr><td>Why</td><td>' + h(p.reason_text) + '</td></tr>' +
      '<tr><td>Rex</td><td><a href="' + h(p.rex_url) + '" target="_blank" rel="noopener">open lead ' + h(p.lead_id) + '</a></td></tr>' +
      '</table>' + (p.note_head ? '<p class="note">' + h(p.note_head) + '</p>' : "") + '</div>';
  }

  function render(p) {
    title.textContent = (p.contact_name || "Lead") + " - lead " + p.lead_id;
    foot.textContent = "HausOS allocation engine v" + (p.engine || "") + ". Nothing is written to Rex until you press a button here.";
    if (p.state !== "pending") {
      subtitle.textContent = "";
      var what = p.state === "confirmed" ? "Confirmed" : p.state === "rejected" ? "Overridden" : p.state === "superseded" ? "Superseded" : p.state === "expired" ? "Expired" : p.state === "error" ? "Error" : p.state;
      var line = p.state === "expired" ? "This proposal expired after " + p.ttl_hours + " hours. Allocate the lead in Rex as usual."
        : p.state === "superseded" ? "The lead was assigned in Rex before this decision was made; nothing was changed."
        : p.state === "error" ? "The decision could not be applied: " + (p.error || "unknown error") + ". Please allocate in Rex manually."
        : "Decided " + when(p.decided_at) + (p.final_partner_name ? " - allocated to " + p.final_partner_name : "") + (p.override_reason ? ". Reason given: " + p.override_reason : "") + ".";
      view.innerHTML = summaryCard(p) + '<div class="outcome ' + (p.state === "error" ? "bad" : "good") + '"><h2>' + h(what) + '</h2><p style="margin:0">' + h(line) + '</p></div>';
      return;
    }
    subtitle.textContent = "Expires " + when(p.expires_at) + ".";
    var html = summaryCard(p);
    if (mode === "confirm") {
      html += '<div class="row"><button class="btn ok" id="go">' + (p.kind === "contact_only" ? "Confirm - move the contact" : "Confirm - allocate to " + h(p.proposed_partner_name)) + '</button>' +
              '<a class="btn no" href="?t=' + encodeURIComponent(token) + '&a=reject">Reject / choose someone else</a></div>';
      view.innerHTML = html;
      document.getElementById("go").onclick = function () { submit({ token: token, action: "confirm" }, this); };
    } else {
      var opts = (p.pool || []).filter(function (x) { return p.kind === "contact_only" || x.id !== p.proposed_partner_id; })
        .map(function (x) { return '<option value="' + h(x.id) + '">' + h(x.name) + (x.paused ? " (paused)" : "") + '</option>'; }).join("");
      html += '<div class="card">' + (p.kind === "contact_only"
        ? '<p style="margin:0">Rejecting leaves the contact with <b>' + h(p.contact_owner_name_before || "its current owner") + '</b>.</p>'
        : '<label for="partner">Allocate to instead</label><select id="partner"><option value="">Choose a partner</option>' + opts + '</select>') +
        '<label for="reason">Reason</label><textarea id="reason" rows="3" placeholder="Why this partner / why not the proposal"></textarea>' +
        '<p class="muted" id="err"></p></div>' +
        '<div class="row"><button class="btn no" id="go">Submit</button><a class="btn ghost" href="?t=' + encodeURIComponent(token) + '&a=confirm">Back to confirm</a></div>';
      view.innerHTML = html;
      document.getElementById("go").onclick = function () {
        var partner = document.getElementById("partner") ? document.getElementById("partner").value : "";
        var reason = document.getElementById("reason").value.trim();
        var err = document.getElementById("err");
        if (p.kind !== "contact_only" && !partner) { err.textContent = "Please choose a partner."; return; }
        if (!reason) { err.textContent = "Please give a reason."; return; }
        err.textContent = "";
        submit({ token: token, action: "reject", partner: partner || null, reason: reason }, this);
      };
    }
  }

  function submit(body, btn) {
    btn.disabled = true; btn.textContent = "Working... (writing to Rex)";
    fetch(API + "?decide=1", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (r && r.outcome) {
          view.innerHTML = '<div class="outcome ' + (r.ok ? "good" : "bad") + '"><h2>' + h(r.outcome) + '</h2><p>' + h(r.detail) + '</p><p style="margin:0"><a href="' + h(r.rex_url) + '" target="_blank" rel="noopener">Open lead in Rex</a></p></div>';
          subtitle.textContent = "";
        } else if (r && r.state) { render(r); }
        else { fail(r && r.error === "choose_partner" ? "Please choose a partner." : "The decision could not be submitted."); }
      })
      .catch(function () { fail("Could not reach the allocation engine."); });
  }

  fetch(API + "?decide=" + encodeURIComponent(token))
    .then(function (r) { return r.json(); })
    .then(function (p) { if (!p || !p.ok) fail(p && p.error === "not_found" ? "Proposal not found - the link is not valid." : "Could not load the proposal."); else render(p); })
    .catch(function () { fail("Could not reach the allocation engine."); });
})();
</script>
</body>
</html>
