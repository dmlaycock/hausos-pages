<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HausOS - partners and leads</title>
<!--
  HausOS partner availability planner v1.7.2 (6 Nov 2026)
  v1.7.2 (David, 6 Nov): the Outcome cell says who made the decision for test / not-a-lead marks
  and for reallocations ("Tracy chose") - the planner user's initials, "email" for a decision
  made from the email links, "engine" for the automatic not-a-lead rule, "call" for a direct
  call. Full wording on hover. Leads the engine excluded itself (portal datafeed-error emails)
  show the tag "Not a lead" instead of "Left alone".
  v1.7.1 (David, 6 Nov): the sequence is now a projection of the engine's rule, not the current
  standings. The page replays the engine's own choice (lowest leads per available day, floor 2;
  tie -> longest since last lead; then name) lead by lead, giving each lead to the winner and
  moving on, for the next 8 fair-share leads. A strip above the grid shows that order (partners
  repeat - e.g. CH, VF, CH, JS...), and each column's label is the lead number at which that
  partner first gets one (NEXT, 2nd, 4th, 7th...), shaded in that order. The projection assumes
  nothing else changes (no planner toggles, no relationship or directed leads, same day).
  v1.7.0 (David, 6 Nov: faster load): the Planner tab's counts come from the engine's fair-share
  cache (API counts -> lead-allocate cached=1, about 0.1 s) on first load, tab switches and after
  a mark; the Refresh button asks for a live Rex pull (counts {live:true}); the API itself goes
  live when the cache is older than 30 minutes. A line under the legend says "Counts as at
  HH:MM (live)" or "(from the last lead at HH:MM)". Allocation is unchanged - always live.
  v1.6.0 (David, 6 Nov): (a) "Not a lead" on the Leads tab beside "Test" - spam, suppliers, not a
  buyer; the lead drops out of fair share, the record and the digest but the contact is left
  alone (API mark_test kind not_a_lead). Each row carries one undo button for whichever mark
  it has. (b) Row highlighting: grey background for test and not-a-lead rows; pale orange for
  leads moved from their original partner at any stage or allocated differently from the
  engine's recommendation (API moved, from ops.lead_report v1.2). (c) "Refreshed HH:MM" and a
  Refresh button at the top of both tabs; the page also refreshes itself when the tab comes
  back into view after 10 minutes. Marking a lead clears the cached counts so the Planner tab
  reloads them. (d) Who is due the next lead is unmissable: that partner's column header is
  solid green with NEXT under the initials; the rest of the available partners are shaded in
  blue by the engine's own order (darkest = second), with 2nd, 3rd... under the initials;
  partners away today are grey. The order is the engine's ranking at the last refresh.
  v1.5.0: lead counts on the Planner tab (David, 6 Nov). Each past-day and today cell shows how
  many leads that partner received that day; two header rows show L7D (leads in the last 7
  days) and per day (L7D / days available, floor 2 - the rate the engine ranks on). Numbers
  come from the engine itself (API counts -> lead-allocate probe), so they match the emails:
  self-created and test leads excluded, pending proposals included. Loaded after the grid.
  v1.4.4: the Leads tab uses the full window width (up to 1500px) so the table fits without
  horizontal scrolling on a laptop; the Planner tab keeps its 980px box (David, 6 Nov).
  v1.4.3: the default filter is "All leads", test leads included and greyed (David, 6 Nov);
  "Real leads only" is the second choice.
  v1.4.2: partner initials in Engine, Outcome and Partner now (full name on hover) so the
  table fits the page (David, 6 Nov).
  v1.4.1: Leads tab tightened (David, 6 Nov): one line per lead. "What happened" shows the
  tag alone with the engine's reason on hover; Outcome is an icon and a word with the full
  text on hover; Mark as test updates the row in place (greyed, button becomes Undo, the row
  stays in view and the page does not jump), so the action is easy to see and to reverse.
  v1.4.0: second tab "Leads" (David, 6 Nov) - every lead the engine received in the last 14
  days (API leads -> ops.lead_report): when, contact, development, source, what the engine
  did and why (fair share / existing contact owner / directed / left to Ed etc.), the outcome,
  who has it now, and a one-click Mark as test / Undo that keeps ops.test_records so the lead
  drops out of fair share, the record and the digest. Tabs remembered per device.
  v1.3.0: catch-up window - while the API returns catch_up_until, the last 7 days are
  editable (shown with a light outline and a note) so absences from before go-live reach the
  engine's fair-share count. After that date they lock as before.
  Static page served from GitHub Pages. Talks to the partner-availability Edge Function
  (JSON). Sign-in by magic link: ?t=TOKEN is exchanged for a 30-day session kept on this
  device. Days down, partners across; the last 7 days are visible but locked.
  v1.2.0: one click on a cell flips that day between Available and Not available. No
  confirmations, no notes, no forms (David, 26 Oct: KISS - a mistake is one click to undo).
  Design: Lead Allocation Engine - Design v5.3 (26 Oct 2026) §3.
-->
<style>
  :root { --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --ok:#1a7f37; --no:#b42318; --bg:#fff; --card:#f9fafb;
          --away:#fcd34d; --away-ink:#78350f; --today:#eef2ff; --locked:#f3f4f6; --wkend:#fafafa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:980px; margin:0 auto; padding:20px 12px 60px; }
  main.wide { max-width:1500px; }
  h1 { font-size:21px; margin:0; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .sub { color:var(--muted); font-size:13px; margin:2px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:0 0 14px; }
  .btn { display:inline-block; padding:9px 14px; border-radius:7px; color:#fff; text-decoration:none; font-weight:600; border:0; font-size:14px; cursor:pointer; background:var(--ok); }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid #cbd5e1; } .btn.sm { padding:6px 10px; font-size:13px; }
  .btn[disabled] { opacity:.55; cursor:default; }
  label { display:block; font-weight:600; font-size:13px; margin:10px 0 4px; }
  input { width:100%; font:inherit; padding:8px; border:1px solid #cbd5e1; border-radius:7px; background:#fff; }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:var(--no); font-size:13px; min-height:18px; margin:8px 0 0; }
  .hidden { display:none !important; }
  .strip { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip { background:#fff7ed; border:1px solid #fed7aa; color:#7c2d12; border-radius:999px; padding:4px 10px; font-size:13px; }
  .chip.none { background:#f0fdf4; border-color:#bbf7d0; color:#14532d; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:6px 0 6px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:4px; border:1px solid #e5e7eb; }
  .wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; max-height:72vh; }
  table.grid { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; table-layout:fixed; }
  .grid th { position:sticky; top:0; background:#fff; z-index:3; border-bottom:2px solid var(--line); padding:8px 4px; text-align:center; font-weight:600; white-space:nowrap; letter-spacing:.02em; }
  .grid th:first-child, .grid td:first-child { position:sticky; left:0; background:#fff; z-index:2; text-align:left; white-space:nowrap; width:96px; min-width:96px; border-right:1px solid var(--line); }
  .grid th:first-child { z-index:4; }
  .grid td { border-bottom:1px solid #f1f5f9; padding:0; height:32px; text-align:center; }
  .grid td.day { padding:4px 8px; font-variant-numeric:tabular-nums; }
  .grid tr.wkend td { background:var(--wkend); }
  .grid tr.locked td { background:var(--locked); color:#9ca3af; }
  .grid tr.locked td:first-child::after { content:" \1F512"; font-size:10px; }
  .grid tr.today td { background:var(--today); }
  .grid tr.today td:first-child { font-weight:700; color:var(--ink); }
  .grid tr.month td { background:#fff; color:var(--ink); font-weight:700; text-align:left; padding:10px 8px 4px; border-bottom:1px solid var(--line); }
  .grid td.cell { cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .grid tr.locked td.cell { cursor:default; }
  .grid td.cell:not(.abs):hover { outline:2px solid #a7f3d0; outline-offset:-2px; }
  .grid tr.locked td.cell:hover { outline:none; }
  .grid td.abs { background:var(--away) !important; color:var(--away-ink); font-size:14px; }
  .grid td.abs:empty::after { content:"\2022"; }
  .grid td.cell { font-variant-numeric:tabular-nums; font-size:13px; }
  .grid td.cell.n0 { color:#c7ccd3; }
  .grid tr.locked td.cell, .grid tr.catchup td.cell { color:#374151; }
  .grid tr.locked td.cell.n0, .grid tr.catchup td.cell.n0 { color:#c7ccd3; }
  .grid tr.stat th { top:33px; font-weight:600; font-size:12px; color:var(--ink); padding:3px 4px; border-bottom:1px solid var(--line); background:#f9fafb; }
  .grid tr.stat2 th { top:56px; font-weight:400; font-size:11px; color:var(--muted); padding:2px 4px 5px; border-bottom:2px solid var(--line); background:#f9fafb; }
  .grid tr.stat th:first-child, .grid tr.stat2 th:first-child { text-align:left; font-weight:600; color:var(--muted); font-size:11px; }
  .grid tr.stat th.lo { color:var(--ok); }
  /* v1.6.0: who gets the next lead (column header block: initials, L7D, per day) */
  .grid th small { display:block; font-size:10px; font-weight:700; letter-spacing:.06em; line-height:1.2; margin-top:2px; min-height:12px; }
  .grid tr.head th { vertical-align:middle; }
  .grid th.seq-1, .grid tr.stat th.seq-1, .grid tr.stat2 th.seq-1 { background:var(--ok); color:#fff; }
  .grid th.seq-2, .grid tr.stat th.seq-2, .grid tr.stat2 th.seq-2 { background:#1d4ed8; color:#fff; }
  .grid th.seq-3, .grid tr.stat th.seq-3, .grid tr.stat2 th.seq-3 { background:#3b82f6; color:#fff; }
  .grid th.seq-4, .grid tr.stat th.seq-4, .grid tr.stat2 th.seq-4 { background:#93c5fd; color:#1e3a8a; }
  .grid th.seq-5, .grid tr.stat th.seq-5, .grid tr.stat2 th.seq-5 { background:#bfdbfe; color:#1e3a8a; }
  .grid th.seq-6, .grid tr.stat th.seq-6, .grid tr.stat2 th.seq-6, .grid th.seq-7, .grid tr.stat th.seq-7, .grid tr.stat2 th.seq-7 { background:#dbeafe; color:#1e3a8a; }
  .grid th.seq-away, .grid tr.stat th.seq-away, .grid tr.stat2 th.seq-away { background:#e5e7eb; color:#6b7280; }
  .queue .q.seq-1 { background:var(--ok); color:#fff; } .queue .q.seq-2 { background:#1d4ed8; color:#fff; } .queue .q.seq-3 { background:#3b82f6; color:#fff; }
  .queue .q.seq-4 { background:#93c5fd; color:#1e3a8a; } .queue .q.seq-5 { background:#bfdbfe; color:#1e3a8a; } .queue .q.seq-6, .queue .q.seq-7 { background:#dbeafe; color:#1e3a8a; }
  .grid th.seq-1 { font-size:15px; }
  .queue { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 8px; font-size:13px; }
  .queue .q { display:inline-block; min-width:40px; text-align:center; padding:4px 8px; border-radius:6px; font-weight:700; letter-spacing:.03em; }
  .queue .q small { display:block; font-size:10px; font-weight:600; opacity:.85; letter-spacing:0; }
  .grid tr.stat th.seq-1 { font-size:14px; }
  .grid tr.locked td.abs { opacity:.55; }
  .grid tr.catchup td { background:#fffbeb; }
  .grid tr.catchup td:first-child { color:#92400e; }
  .grid td.busy { opacity:.5; }
  .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; z-index:60; }
  .signin { max-width:420px; margin:40px auto; }
  .tabs { display:flex; gap:6px; margin:0 0 12px; border-bottom:1px solid var(--line); }
  .tab { background:none; border:0; border-bottom:3px solid transparent; padding:8px 12px; font:inherit; font-weight:600; color:var(--muted); cursor:pointer; margin-bottom:-1px; }
  .tab.on { color:var(--ink); border-bottom-color:var(--ok); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 10px; }
  .filters select, .filters input { width:auto; padding:7px 9px; font-size:14px; }
  .sum { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin:0 0 10px; }
  .sum b { color:var(--ink); }
  .leads .ini { font-weight:600; letter-spacing:.03em; cursor:help; }
  table.leads { border-collapse:collapse; width:100%; font-size:13px; }
  .leads th { text-align:left; padding:8px 6px; border-bottom:2px solid var(--line); font-weight:600; white-space:nowrap; position:sticky; top:0; background:#fff; z-index:2; }
  .leads td { padding:6px 6px; border-bottom:1px solid #f1f5f9; vertical-align:middle; white-space:nowrap; max-width:260px; overflow:hidden; text-overflow:ellipsis; }
  .leads td.o { white-space:nowrap; } .leads .ico { display:inline-block; width:16px; text-align:center; margin-right:3px; font-weight:700; }
  .leads .who { display:inline-block; font-size:10px; font-weight:600; letter-spacing:.03em; padding:0 5px; border-radius:999px; background:#e5e7eb; color:#374151; margin-left:4px; vertical-align:1px; }
  .leads tr.test .who, .leads tr.notlead .who { background:#e5e7eb; color:#6b7280; }
  .leads .ico.ok { color:var(--ok); } .leads .ico.wait { color:#b45309; } .leads .ico.no { color:var(--no); } .leads .ico.dim { color:#9ca3af; }
  .leads td[title], .leads .tag[title] { cursor:help; }
  .leads td.when { white-space:nowrap; color:var(--muted); }
  .leads tr.moved td { background:#ffedd5; }
  .leads tr.test td, .leads tr.notlead td { background:#f3f4f6; color:#9ca3af; } .leads tr.test td.c, .leads tr.notlead td.c { text-decoration:line-through; }
  .leads td.act { white-space:nowrap; } .leads td.act .tbtn + .tbtn { margin-left:4px; }
  .leads tr.skip td { color:#6b7280; }
  .leads .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; background:#eef2ff; color:#3730a3; white-space:nowrap; }
  .leads .tag.rel { background:#fef3c7; color:#92400e; } .leads .tag.skip { background:#f3f4f6; color:#6b7280; } .leads .tag.dir { background:#ecfeff; color:#155e75; } .leads .tag.test { background:#fee2e2; color:#991b1b; }
  .leads a { color:#1a56db; }
  .tbtn { font:inherit; font-size:12px; padding:4px 8px; border-radius:6px; border:1px solid #cbd5e1; background:#fff; cursor:pointer; white-space:nowrap; }
  .tbtn.on { background:#fee2e2; border-color:#fecaca; color:#991b1b; }
  .wrapl { overflow:auto; border:1px solid var(--line); border-radius:10px; max-height:72vh; }
  @media (max-width:760px) {
    table.leads, .leads thead, .leads tbody, .leads tr, .leads td { display:block; }
    .leads thead { display:none; }
    .leads tr { border-bottom:1px solid var(--line); padding:8px 10px; }
    .leads tr.moved, .leads tr.test, .leads tr.notlead { border-radius:6px; }
    .leads td { border:0; padding:2px 0; white-space:normal; max-width:none; }
    .leads td::before { content:attr(data-l) ": "; color:var(--muted); font-size:12px; }
    .leads td.c::before, .leads td.when::before, .leads td.act::before { content:""; }
    .leads td.c { font-weight:600; font-size:14px; }
  }
  @media (max-width:640px) { .grid th:first-child, .grid td:first-child { width:76px; min-width:76px; } .grid th { padding:8px 2px; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>Partners and leads</h1><p class="sub" id="sub">Loading...</p></div>
    <div id="topbtns" class="hidden"><span class="muted" id="refreshed"></span> <button class="btn ghost sm" id="refbtn">Refresh</button> <button class="btn ghost sm" id="outbtn">Sign out</button></div>
  </div>
  <div class="tabs hidden" id="tabs"><button class="tab on" data-tab="planner">Planner</button><button class="tab" data-tab="leads">Leads (last 14 days)</button></div>
  <div id="view"></div>
  <p class="muted" id="foot"></p>
</main>

<script>
(function () {
  var API = "https://mlhvcyrjycdnswdfsofc.supabase.co/functions/v1/partner-availability";
  var SHOW_WEEKS = 8, STEP_WEEKS = 8;
  var view = document.getElementById("view"), sub = document.getElementById("sub"), foot = document.getElementById("foot"), topbtns = document.getElementById("topbtns");
  var state = { session: null, data: null, showWeeks: SHOW_WEEKS, away: {}, live: false, tab: (location.hash === "#leads" ? "leads" : null) || load("hausos_planner_tab") || "planner", leads: null, lf: "all", lq: "", keep: {}, counts: null, refreshed: null };   // away["partner|day"] = true; keep[lead_id] = row toggled since the last full render (stays visible)
  var tabs = document.getElementById("tabs");

  function h(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function toast(msg) { var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200); }

  // ---- dates (YYYY-MM-DD strings; arithmetic in UTC so clock changes cannot shift a day)
  function parse(s) { var p = s.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function fmt(ms) { return new Date(ms).toISOString().slice(0, 10); }
  function addDays(s, n) { return fmt(parse(s) + n * 86400000); }
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function label(s) { var d = new Date(parse(s)); return DOW[d.getUTCDay()] + " " + d.getUTCDate(); }
  function longLabel(s) { var d = new Date(parse(s)); return DOW[d.getUTCDay()] + " " + d.getUTCDate() + " " + MON[d.getUTCMonth()]; }
  function monthLabel(s) { var d = new Date(parse(s)); return MON[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
  function isWeekend(s) { var d = new Date(parse(s)).getUTCDay(); return d === 0 || d === 6; }
  function initials(name) { return String(name || "").split(/[\s-]+/).filter(Boolean).map(function (w) { return w[0].toUpperCase(); }).join("").slice(0, 3); }

  // ---- API
  function call(body) {
    var headers = { "content-type": "application/json" };
    if (state.session) headers.authorization = "Bearer " + state.session;
    return fetch(API, { method: "POST", headers: headers, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
  }
  function reload() {
    return call({ action: "list" }).then(function (r) {
      if (!r.ok) { if (r._status === 401) { signedOut(); return; } throw new Error(r.message || r.error); }
      state.data = r; indexAway(); tabs.classList.remove("hidden"); stamp(); show();
    }).catch(function (e) { sub.textContent = ""; view.innerHTML = '<div class="card"><b>Could not load the planner.</b><p class="muted">' + h(e.message || e) + '</p><p><button class="btn ghost" onclick="location.reload()">Try again</button></p></div>'; });
  }
  // Expand absence rows (any length) into a set of partner|day keys for the visible range.
  function indexAway() {
    var d = state.data, map = {};
    d.absences.forEach(function (a) {
      var end = a.last_day === null ? d.to : (a.last_day < d.to ? a.last_day : d.to);
      for (var day = (a.first_day < d.from ? d.from : a.first_day); day <= end; day = addDays(day, 1)) map[a.partner_id + "|" + day] = true;
    });
    state.away = map;
  }
  function isAway(p, day) { return !!state.away[p + "|" + day]; }

  // ---- refresh (v1.6.0): one button reloads the planner, the counts and the leads; the time shown is the last successful load.
  var refbtn = document.getElementById("refbtn"), refreshedEl = document.getElementById("refreshed");
  function stamp() {
    state.refreshed = Date.now();
    try { refreshedEl.textContent = "Refreshed " + new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London", hour: "2-digit", minute: "2-digit" }); } catch (e) { refreshedEl.textContent = ""; }
    refbtn.disabled = false; refbtn.textContent = "Refresh";
  }
  function refreshAll() {
    if (!state.session) return;
    refbtn.disabled = true; refbtn.textContent = "Refreshing...";
    state.counts = null; state.leads = null; state.live = true;   // v1.7.0: the button asks the engine for a live Rex pull
    reload();
  }
  refbtn.onclick = refreshAll;
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && state.session && state.refreshed && Date.now() - state.refreshed > 10 * 60000) refreshAll();
  });

  // ---- sign in
  function signedOut() {
    state.session = null; store("hausos_planner_session", null);
    topbtns.classList.add("hidden"); tabs.classList.add("hidden"); sub.textContent = "Sign in to see and change partner availability."; foot.textContent = "";
    view.innerHTML = '<div class="card signin"><label for="email">Your email address</label><input id="email" type="email" autocomplete="email" placeholder="name@hausproperties.com">' +
      '<p class="err" id="err"></p><p><button class="btn" id="go">Email me a sign-in link</button></p>' +
      '<p class="muted">The link works once and expires in 30 minutes. After that you stay signed in on this device for 30 days.</p></div>';
    var go = document.getElementById("go"), email = document.getElementById("email"), err = document.getElementById("err");
    function send() {
      var v = email.value.trim(); if (!v) { err.textContent = "Please enter your email address."; return; }
      go.disabled = true; err.textContent = "";
      call({ action: "login", email: v }).then(function (r) {
        go.disabled = false;
        if (r.ok) { view.innerHTML = '<div class="card signin"><b>Check your inbox.</b><p class="muted">' + h(r.message) + '</p></div>'; }

    sub.textContent = "Every lead the allocation engine received in the last 14 days, newest first - what it did and why, and where the lead is now. Mark a lead as Test or Not a lead and it drops out of the partners' lead counts, the record and the daily digest.";
    foot.textContent = "HausOS planner v1.7.2 (API v" + d.version + "). 'Partner now' comes from the warehouse, refreshed twice a day; everything else is live at the last refresh.";
    if (!state.leads) { view.innerHTML = '<div class="card">Loading leads...</div>'; loadLeads(); return; }
    var all = state.leads, q = state.lq.toLowerCase();
    var rows = all.filter(function (L) {
      var f = state.lf;
      if (f === "engine" && (L.step === "skip" || L.is_test)) return false;
      if (f === "rel" && L.reason !== "allocated_relationship") return false;
      if (f === "skip" && L.step !== "skip") return false;
      if (f === "real" && excl(L) && !state.keep[L.lead_id]) return false;
      if (f === "test" && !excl(L) && !state.keep[L.lead_id]) return false;
      if (f === "moved" && !(L.moved && !excl(L)) && !state.keep[L.lead_id]) return false;
      if (q && ((L.contact_name || "") + " " + (L.development || "") + " " + (L.source || "") + " " + (L.engine_partner || "") + " " + (L.partner_now || "") + " " + L.lead_id).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var html = '<div class="sum" id="sum">' + sumHtml() + '</div>';
    html += '<div class="filters"><select id="lf"><option value="all">All leads</option><option value="real">Real leads only</option><option value="engine">Handled by the engine</option><option value="rel">Existing contact owner</option><option value="skip">Left alone</option><option value="moved">Moved or changed</option><option value="test">Test / not a lead</option></select>' +
            '<input id="lq" type="search" placeholder="Search name, development, partner..." value="' + h(state.lq) + '"><span class="muted">' + rows.length + ' shown</span></div>';
    html += '<div class="wrapl"><table class="leads"><thead><tr><th>When</th><th>Contact</th><th>Development</th><th>Source</th><th>What happened</th><th>Engine &rarr;</th><th>Outcome</th><th>Partner now</th><th></th></tr></thead><tbody>';
    rows.forEach(function (L) { html += rowHtml(L); });
    html += '</tbody></table></div>';
    if (!rows.length) html += '<p class="muted">Nothing matches.</p>';
    html += '<div class="legend" style="margin-top:8px"><span><i style="background:#ffedd5"></i>Moved from the original partner, or allocated differently from the engine\'s recommendation</span><span><i style="background:#f3f4f6"></i>Test / not a lead (not counted)</span></div>';
    view.innerHTML = html;
    document.getElementById("lf").value = state.lf;
    document.getElementById("lf").onchange = function () { state.lf = this.value; renderLeads(); };
    var lq = document.getElementById("lq"); lq.oninput = function () { state.lq = this.value; renderLeads(); var e = document.getElementById("lq"); e.focus(); e.setSelectionRange(e.value.length, e.value.length); };
    bindTestButtons();
  }
  // Mark as test / undo: the row is redrawn where it stands (greyed or not), the summary counts
  // follow, and nothing else moves, so the change is easy to see and one click to reverse.
  function bindTestButtons() {
    var wrap = document.querySelector(".wrapl"); if (!wrap) return;
    wrap.onclick = function (ev) {
      var b = ev.target.closest(".tbtn"); if (!b || b.disabled) return;
      var id = b.dataset.id, k = b.dataset.k, L = state.leads.filter(function (x) { return x.lead_id === id; })[0]; if (!L) return;
      var td = b.parentNode, before = td.innerHTML;
      td.querySelectorAll(".tbtn").forEach(function (x) { x.disabled = true; }); b.textContent = "Saving...";
      var body = k === "undo" ? { action: "unmark_test", lead_id: id } : { action: "mark_test", lead_id: id, kind: k };
      call(body).then(function (r) {
        if (!r.ok) { td.innerHTML = before; toast(r.message || r.error || "Not saved"); if (r._status === 401) signedOut(); return; }
        L.is_test = !!r.is_test; L.exclusion = r.exclusion || null;
        L.decided_by_label = L.exclusion ? (state.data.user.name || state.data.user.email) : null;   // v1.7.2: shown in Outcome
        if (L.state === "pending" && L.exclusion) L.state = L.exclusion === "not_a_lead" ? "not_lead" : "test";
        state.keep[id] = true; state.counts = null;   // the Planner tab reloads the engine's counts next time it is shown
        var tr = wrap.querySelector('tr[data-id="' + id + '"]');
        if (tr) { var tmp = document.createElement("tbody"); tmp.innerHTML = rowHtml(L); tr.replaceWith(tmp.firstElementChild); }
        var sum = document.getElementById("sum"); if (sum) sum.innerHTML = sumHtml();
        toast(L.exclusion === "not_a_lead" ? "Marked as not a lead - no longer counted" : L.exclusion ? "Marked as a test lead - no longer counted" : "Back in the counts");
      }).catch(function () { td.innerHTML = before; toast("Could not reach HausOS - not saved"); });
    };
  }

  // ---- one click = toggle (optimistic; reverts if the API says no)
  function bind() {
    document.querySelectorAll("td.cell").forEach(function (td) {
      td.onclick = function () {
        if (td.parentNode.classList.contains("locked") || td.classList.contains("busy")) return;
        var p = td.dataset.p, day = td.dataset.day, key = p + "|" + day, was = !!state.away[key];
        if (was) delete state.away[key]; else state.away[key] = true;
        td.classList.toggle("abs", !was); td.classList.add("busy");
        var strip = document.querySelector(".strip"); if (strip) strip.innerHTML = stripHtml();
        call({ action: "toggle", partner_id: p, day: day }).then(function (r) {
          td.classList.remove("busy");
          if (r.ok && state.counts && (state.counts.days || []).indexOf(day) >= 0) { state.counts = null; loadCounts(); }
          if (!r.ok) {
            if (was) state.away[key] = true; else delete state.away[key];
            td.classList.toggle("abs", was); if (strip) strip.innerHTML = stripHtml();
            toast(r.message || r.error || "Not saved"); if (r._status === 401) signedOut();
          }
        }).catch(function () {
          td.classList.remove("busy");
          if (was) state.away[key] = true; else delete state.away[key];
          td.classList.toggle("abs", was); if (strip) strip.innerHTML = stripHtml();
          toast("Could not reach HausOS - not saved");
        });
      };
    });
  }

  document.getElementById("outbtn").onclick = function () { call({ action: "logout" }).catch(function () {}).then(signedOut); };

  start();
})();
</script>
</body>
