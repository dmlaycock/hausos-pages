<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HausOS - partner availability</title>
<!--
  HausOS partner availability planner v1.2.0 (26 Oct 2026)
  Static page served from GitHub Pages. Talks to the partner-availability Edge Function
  (JSON). Sign-in by magic link: ?t=TOKEN is exchanged for a 30-day session kept on this
  device. Days down, partners across; the last 7 days are visible but locked.
  v1.2.0: one click on a cell flips that day between Available and Not available. No
  confirmations, no notes, no forms (David, 26 Oct: KISS - a mistake is one click to undo).
  Design: Lead Allocation Engine - Design v5.3 (26 Oct 2026) §3.
-->
<style>
  :root { --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --ok:#1a7f37; --no:#b42318; --bg:#fff; --card:#f9fafb;
          --away:#fcd34d; --away-ink:#78350f; --today:#eef2ff; --locked:#f3f4f6; --wkend:#fafafa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:980px; margin:0 auto; padding:20px 12px 60px; }
  h1 { font-size:21px; margin:0; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .sub { color:var(--muted); font-size:13px; margin:2px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:0 0 14px; }
  .btn { display:inline-block; padding:9px 14px; border-radius:7px; color:#fff; text-decoration:none; font-weight:600; border:0; font-size:14px; cursor:pointer; background:var(--ok); }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid #cbd5e1; } .btn.sm { padding:6px 10px; font-size:13px; }
  .btn[disabled] { opacity:.55; cursor:default; }
  label { display:block; font-weight:600; font-size:13px; margin:10px 0 4px; }
  input { width:100%; font:inherit; padding:8px; border:1px solid #cbd5e1; border-radius:7px; background:#fff; }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:var(--no); font-size:13px; min-height:18px; margin:8px 0 0; }
  .hidden { display:none !important; }
  .strip { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip { background:#fff7ed; border:1px solid #fed7aa; color:#7c2d12; border-radius:999px; padding:4px 10px; font-size:13px; }
  .chip.none { background:#f0fdf4; border-color:#bbf7d0; color:#14532d; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:6px 0 6px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:4px; border:1px solid #e5e7eb; }
  .wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; max-height:72vh; }
  table.grid { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; table-layout:fixed; }
  .grid th { position:sticky; top:0; background:#fff; z-index:3; border-bottom:2px solid var(--line); padding:8px 4px; text-align:center; font-weight:600; white-space:nowrap; letter-spacing:.02em; }
  .grid th:first-child, .grid td:first-child { position:sticky; left:0; background:#fff; z-index:2; text-align:left; white-space:nowrap; width:96px; min-width:96px; border-right:1px solid var(--line); }
  .grid th:first-child { z-index:4; }
  .grid td { border-bottom:1px solid #f1f5f9; padding:0; height:32px; text-align:center; }
  .grid td.day { padding:4px 8px; font-variant-numeric:tabular-nums; }
  .grid tr.wkend td { background:var(--wkend); }
  .grid tr.locked td { background:var(--locked); color:#9ca3af; }
  .grid tr.locked td:first-child::after { content:" \1F512"; font-size:10px; }
  .grid tr.today td { background:var(--today); }
  .grid tr.today td:first-child { font-weight:700; color:var(--ink); }
  .grid tr.month td { background:#fff; color:var(--ink); font-weight:700; text-align:left; padding:10px 8px 4px; border-bottom:1px solid var(--line); }
  .grid td.cell { cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .grid tr.locked td.cell { cursor:default; }
  .grid td.cell:not(.abs):hover { outline:2px solid #a7f3d0; outline-offset:-2px; }
  .grid tr.locked td.cell:hover { outline:none; }
  .grid td.abs { background:var(--away) !important; color:var(--away-ink); font-size:14px; }
  .grid td.abs::after { content:"\2022"; }
  .grid tr.locked td.abs { opacity:.55; }
  .grid td.busy { opacity:.5; }
  .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; z-index:60; }
  .signin { max-width:420px; margin:40px auto; }
  @media (max-width:640px) { .grid th:first-child, .grid td:first-child { width:76px; min-width:76px; } .grid th { padding:8px 2px; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>Partner availability</h1><p class="sub" id="sub">Loading...</p></div>
    <div id="topbtns" class="hidden"><button class="btn ghost sm" id="outbtn">Sign out</button></div>
  </div>
  <div id="view"></div>
  <p class="muted" id="foot"></p>
</main>

<script>
(function () {
  var API = "https://mlhvcyrjycdnswdfsofc.supabase.co/functions/v1/partner-availability";
  var SHOW_WEEKS = 8, STEP_WEEKS = 8;
  var view = document.getElementById("view"), sub = document.getElementById("sub"), foot = document.getElementById("foot"), topbtns = document.getElementById("topbtns");
  var state = { session: null, data: null, showWeeks: SHOW_WEEKS, away: {} };   // away["partner|day"] = true

  function h(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function toast(msg) { var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200); }

  // ---- dates (YYYY-MM-DD strings; arithmetic in UTC so clock changes cannot shift a day)
  function parse(s) { var p = s.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function fmt(ms) { return new Date(ms).toISOString().slice(0, 10); }
  function addDays(s, n) { return fmt(parse(s) + n * 86400000); }
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function label(s) { var d = new Date(parse(s)); return DOW[d.getUTCDay()] + " " + d.getUTCDate(); }
  function longLabel(s) { var d = new Date(parse(s)); return DOW[d.getUTCDay()] + " " + d.getUTCDate() + " " + MON[d.getUTCMonth()]; }
  function monthLabel(s) { var d = new Date(parse(s)); return MON[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
  function isWeekend(s) { var d = new Date(parse(s)).getUTCDay(); return d === 0 || d === 6; }
  function initials(name) { return String(name || "").split(/[\s-]+/).filter(Boolean).map(function (w) { return w[0].toUpperCase(); }).join("").slice(0, 3); }

  // ---- API
  function call(body) {
    var headers = { "content-type": "application/json" };
    if (state.session) headers.authorization = "Bearer " + state.session;
    return fetch(API, { method: "POST", headers: headers, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
  }
  function reload() {
    return call({ action: "list" }).then(function (r) {
      if (!r.ok) { if (r._status === 401) { signedOut(); return; } throw new Error(r.message || r.error); }
      state.data = r; indexAway(); render();
    }).catch(function (e) { sub.textContent = ""; view.innerHTML = '<div class="card"><b>Could not load the planner.</b><p class="muted">' + h(e.message || e) + '</p><p><button class="btn ghost" onclick="location.reload()">Try again</button></p></div>'; });
  }
  // Expand absence rows (any length) into a set of partner|day keys for the visible range.
  function indexAway() {
    var d = state.data, map = {};
    d.absences.forEach(function (a) {
      var end = a.last_day === null ? d.to : (a.last_day < d.to ? a.last_day : d.to);
      for (var day = (a.first_day < d.from ? d.from : a.first_day); day <= end; day = addDays(day, 1)) map[a.partner_id + "|" + day] = true;
    });
    state.away = map;
  }
  function isAway(p, day) { return !!state.away[p + "|" + day]; }

  // ---- sign in
  function signedOut() {
    state.session = null; store("hausos_planner_session", null);
    topbtns.classList.add("hidden"); sub.textContent = "Sign in to see and change partner availability."; foot.textContent = "";
    view.innerHTML = '<div class="card signin"><label for="email">Your email address</label><input id="email" type="email" autocomplete="email" placeholder="name@hausproperties.com">' +
      '<p class="err" id="err"></p><p><button class="btn" id="go">Email me a sign-in link</button></p>' +
      '<p class="muted">The link works once and expires in 30 minutes. After that you stay signed in on this device for 30 days.</p></div>';
    var go = document.getElementById("go"), email = document.getElementById("email"), err = document.getElementById("err");
    function send() {
      var v = email.value.trim(); if (!v) { err.textContent = "Please enter your email address."; return; }
      go.disabled = true; err.textContent = "";
      call({ action: "login", email: v }).then(function (r) {
        go.disabled = false;
        if (r.ok) { view.innerHTML = '<div class="card signin"><b>Check your inbox.</b><p class="muted">' + h(r.message) + '</p></div>'; }
        else err.textContent = r.message || "Could not send the link.";
      }).catch(function () { go.disabled = false; err.textContent = "Could not reach HausOS."; });
    }
    go.onclick = send; email.onkeydown = function (e) { if (e.key === "Enter") send(); };
    email.focus();
  }

  function start() {
    var q = new URLSearchParams(location.search), t = q.get("t");
    if (t) {
      sub.textContent = "Signing you in...";
      call({ action: "session", token: t }).then(function (r) {
        history.replaceState(null, "", location.pathname);
        if (!r.ok) { signedOut(); document.getElementById("err").textContent = r.message || "That link did not work."; return; }
        state.session = r.session; store("hausos_planner_session", r.session);
        reload();
      }).catch(function () { signedOut(); });
      return;
    }
    state.session = load("hausos_planner_session");
    if (!state.session) { signedOut(); return; }
    reload();
  }

  // ---- render
  function render() {
    var d = state.data;
    topbtns.classList.remove("hidden");
    sub.textContent = "Signed in as " + (d.user.name || d.user.email) + ". Today is " + longLabel(d.today) + ". Click a day to mark a partner not available; click again to make them available. The last 7 days are locked.";
    foot.textContent = "HausOS planner v1.2.0 (API v" + d.version + "). The allocation engine reads this the moment a lead arrives.";
    var html = '<div class="card"><div class="strip">' + stripHtml() + '</div></div>';
    html += '<div class="legend"><span><i style="background:var(--away)"></i>Not available</span><span><i style="background:#fff"></i>Available</span><span><i style="background:var(--locked)"></i>Locked (last 7 days)</span></div>';
    html += '<p class="muted" style="margin:0 0 8px">' + d.partners.map(function (p) { return '<b>' + h(initials(p.full_name)) + '</b> ' + h(p.full_name); }).join(' &middot; ') + '</p>';
    html += '<div class="wrap">' + grid() + '</div>';
    html += '<p style="margin:10px 0 0"><button class="btn ghost sm" id="more">Show further ahead</button> <span class="muted" id="range"></span></p>';
    view.innerHTML = html;
    document.getElementById("range").textContent = "Showing " + longLabel(d.from) + " to " + longLabel(visibleTo()) + ".";
    document.getElementById("more").onclick = function () { state.showWeeks += STEP_WEEKS; render(); };
    bind();
    var today = document.querySelector("tr.today"), wrap = document.querySelector(".wrap"); if (today && wrap) wrap.scrollTop = Math.max(0, today.offsetTop - wrap.clientHeight / 3);
  }
  function visibleTo() { var t = addDays(state.data.today, state.showWeeks * 7); return t < state.data.to ? t : state.data.to; }

  // Runs of consecutive not-available days per partner, from today, for the strip.
  function stripHtml() {
    var d = state.data, end = addDays(d.today, 6), out = [];
    d.partners.forEach(function (p) {
      var first = null;
      for (var day = d.today; day <= end; day = addDays(day, 1)) if (isAway(p.partner_id, day)) { first = day; break; }
      if (!first) return;
      var last = first; while (isAway(p.partner_id, addDays(last, 1))) last = addDays(last, 1);
      var txt = p.full_name.split(" ")[0] + ": " + (first === d.today ? "away" : "away from " + label(first)) + (last >= d.to ? "" : ", back " + label(addDays(last, 1)));
      out.push('<span class="chip">' + h(txt) + '</span>');
    });
    return '<b style="font-size:13px">Not available this week:</b>' + (out.length ? out.join("") : '<span class="chip none">Everyone is available</span>');
  }

  function grid() {
    var d = state.data, to = visibleTo(), rows = [], lastMonth = "";
    var head = '<tr><th>Day</th>' + d.partners.map(function (p) { return '<th title="' + h(p.full_name) + '">' + h(initials(p.full_name)) + '</th>'; }).join("") + '</tr>';
    for (var day = d.from; day <= to; day = addDays(day, 1)) {
      var m = monthLabel(day);
      if (m !== lastMonth) { rows.push('<tr class="month"><td colspan="' + (d.partners.length + 1) + '">' + h(m) + '</td></tr>'); lastMonth = m; }
      var locked = day < d.today, cls = (locked ? "locked " : "") + (day === d.today ? "today " : "") + (isWeekend(day) ? "wkend" : "");
      var cells = d.partners.map(function (p) {
        return '<td class="cell' + (isAway(p.partner_id, day) ? " abs" : "") + '" data-day="' + day + '" data-p="' + h(p.partner_id) + '" title="' + h(p.full_name + " " + longLabel(day)) + '"></td>';
      }).join("");
      rows.push('<tr class="' + cls.trim() + '"><td class="day">' + h(label(day)) + '</td>' + cells + '</tr>');
    }
    return '<table class="grid">' + head + rows.join("") + '</table>';
  }

  // ---- one click = toggle (optimistic; reverts if the API says no)
  function bind() {
    document.querySelectorAll("td.cell").forEach(function (td) {
      td.onclick = function () {
        if (td.parentNode.classList.contains("locked") || td.classList.contains("busy")) return;
        var p = td.dataset.p, day = td.dataset.day, key = p + "|" + day, was = !!state.away[key];
        if (was) delete state.away[key]; else state.away[key] = true;
        td.classList.toggle("abs", !was); td.classList.add("busy");
        var strip = document.querySelector(".strip"); if (strip) strip.innerHTML = stripHtml();
        call({ action: "toggle", partner_id: p, day: day }).then(function (r) {
          td.classList.remove("busy");
          if (!r.ok) {
            if (was) state.away[key] = true; else delete state.away[key];
            td.classList.toggle("abs", was); if (strip) strip.innerHTML = stripHtml();
            toast(r.message || r.error || "Not saved"); if (r._status === 401) signedOut();
          }
        }).catch(function () {
          td.classList.remove("busy");
          if (was) state.away[key] = true; else delete state.away[key];
          td.classList.toggle("abs", was); if (strip) strip.innerHTML = stripHtml();
          toast("Could not reach HausOS - not saved");
        });
      };
    });
  }

  document.getElementById("outbtn").onclick = function () { call({ action: "logout" }).catch(function () {}).then(signedOut); };

  start();
})();
</script>
</body>
</html>
